name: Deploy Farmax to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public website
        run: |
          mkdir -p _site/assets _site/images
          cp index.html about.html tea.html estates.html agriculture.html careers.html contact.html site.css site.js .nojekyll _site/
          cp assets/tea-landscape.jpg assets/credits.md _site/assets/
          cp images/IMG-20260810-WA0189.jpg _site/images/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
